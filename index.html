<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Mapa de Defectos · Doowon</title>
<style>
/* Mobile-first app shell: white app bar with the Doowon logo, one view per tab, bottom tab bar (left rail on wide screens).
   Brand colours taken from the Doowon logo in the company PPT template (blue wordmark, red disc). */
:root{
  --brand:#0A2FD0; --brand-deep:#071F8F; --brand-soft:#E8EDFF; --red:#E30613;
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EBEEF4; --ink:#141A26; --muted:#5B6474; --line:#D7DCE6;
  --F:#D7141A; --M:#EF7D00; --A:#6E86C9; --S:#9AA3B1;
  --hi:#D7141A; --mid:#E0A100; --ok:#2E7D32; --na:#78858F;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --r:14px; --tabh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131B; --surface:#171C26; --sunk:#222936; --ink:#E8ECF3; --muted:#9AA4B5; --line:#2E3646; --brand-soft:#1A2350; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F131B; --surface:#171C26; --sunk:#222936; --ink:#E8ECF3; --muted:#9AA4B5; --line:#2E3646; --brand-soft:#1A2350; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,.filebtn{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
button:active,.filebtn:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,select:focus-visible,.mapwrap:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
button.primary{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
button.danger{background:var(--red);color:#fff;border-color:var(--red)}
button[hidden],.filebtn[hidden],[hidden]{display:none!important}
select,input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:48px;min-width:0}
label,.lbl{font-size:14px;color:var(--muted);font-weight:600}

/* app bar */
.appbar{position:sticky;top:0;z-index:15;background:#fff;border-bottom:3px solid var(--brand);padding:calc(8px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.appbar .logo{height:22px;width:auto;display:block}
.appbar .ttl{flex:1;min-width:0;color:#141A26;font-weight:700;font-size:15px;line-height:1.15;border-left:1px solid #D7DCE6;padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ttl small{display:block;font-weight:500;color:#5B6474;font-size:12px}
.appbar button{min-height:36px;padding:6px 10px;font-size:14px;background:#fff;color:#141A26;border-color:#D7DCE6}
.sync{font-size:13px!important;padding:6px 9px!important;white-space:nowrap}
.sync .sd{width:9px;height:9px;border-radius:50%;background:#9AA3B1}
.sync[data-st="ok"] .sd{background:#2E7D32}.sync[data-st="pend"] .sd,.sync[data-st="sync"] .sd{background:#E0A100}
.sync[data-st="err"] .sd,.sync[data-st="key"] .sd,.sync[data-st="offline"] .sd{background:#D7141A}
@media (max-width:420px){.sync .st{display:none}.appbar .ttl small{display:none}}

/* layout */
.shell{display:flex;min-height:100dvh;flex-direction:column}
main{flex:1;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(var(--tabh) + 20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));width:100%;max-width:1280px;margin:0 auto}
.view{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:700}
.row2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.big{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);margin:0 0 8px}
.today{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.today .when{font-weight:700;font-size:18px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-shadow:0 -4px 16px rgba(10,20,50,.06)}
.tabbar button{border:0;border-radius:0;background:transparent;flex-direction:column;gap:2px;min-height:var(--tabh);font-size:12px;color:var(--muted);font-weight:600;padding:6px 2px}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--brand)}
.tabbar button[aria-current="page"] .ind{background:var(--brand)}
.tabbar .ind{display:block;width:28px;height:3px;border-radius:2px;background:transparent;margin-bottom:2px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:14;border-radius:28px;background:var(--brand);color:#fff;border:0;font-weight:700;box-shadow:0 6px 18px rgba(10,47,208,.35);min-height:52px;padding:0 20px}

@media (min-width:960px){
  .shell{flex-direction:row;flex-wrap:wrap}
  .appbar{width:100%}
  .tabbar{position:sticky;top:60px;align-self:flex-start;height:calc(100dvh - 60px);width:96px;grid-template-columns:1fr;grid-auto-rows:84px;align-content:start;border-top:0;border-right:1px solid var(--line);box-shadow:none;padding-top:8px}
  main{padding-bottom:24px;flex:1;min-width:0}
  .fab{bottom:24px}
  .mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;align-items:start}
}

/* segmented controls / chips */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:6px 14px;font-size:15px;border-radius:20px}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.cls button{font-size:14px;padding:6px 12px}
.cls button[aria-pressed="true"]{background:var(--brand-soft);color:var(--ink);border-color:var(--brand)}
.cls button[aria-pressed="false"]{color:var(--muted)}
.cls button[aria-pressed="false"] .dot{opacity:.35}
.cls .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.dayrow{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;margin-top:10px}
.dayrow button{padding:0;font-size:22px}

/* maps */
.mapscroll{overflow:auto;border-radius:10px;border:1px solid var(--line);background:#fff;max-height:70dvh;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.mapwrap{position:relative;width:100%;aspect-ratio:905/899;background:#fff;cursor:crosshair;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.mapwrap img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.mapwrap canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pins{position:absolute;inset:0;pointer-events:none}
.pin.draft{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:4px solid var(--brand);box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(10,47,208,.25);background:rgba(255,255,255,.4)}
.zoom{display:flex;gap:6px;align-items:center}
.zoom button{min-width:44px;padding:0;font-size:20px;font-weight:700}
.zoom span{font-family:var(--mono);font-size:14px;color:var(--muted);min-width:34px;text-align:center}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ramp{width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(255,236,140,.25),#ffc83c,#ff8000,#dc2814,#8c0000);border:1px solid var(--line)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions>*{flex:1 1 160px}

/* lists */
.alerts{display:flex;flex-direction:column;gap:2px}
.alerts button{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 10px;align-items:start;text-align:left;border:0;border-radius:10px;background:transparent;padding:10px 6px;min-height:0;color:var(--ink)}
.alerts button:active{background:var(--sunk)}
.alerts .dot{margin-top:6px}
.alerts .k{font-weight:700;overflow-wrap:anywhere}
.alerts .r{font-family:var(--mono);font-size:14px;font-weight:700;white-space:nowrap}
.alerts .d{grid-column:2/4;color:var(--muted);font-size:13px}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);margin-bottom:6px}
.stack span{height:100%}
.stackleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
.stackleg span{display:inline-flex;align-items:center;gap:5px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:15px}
.bar .nm{display:inline-flex;align-items:center;gap:6px;min-width:0}
.bar .track{grid-column:1/-1;height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px}
.bar .n{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.days{display:flex;flex-direction:column;gap:2px}
.days button{display:grid;grid-template-columns:86px minmax(0,1fr) 86px;align-items:center;gap:8px;border:0;border-radius:10px;background:transparent;padding:6px 8px;min-height:42px;font-size:14px;text-align:left;color:var(--ink)}
.days button[aria-pressed="true"]{background:var(--brand);color:#fff}
.days .dtrack{height:9px;background:var(--sunk);border-radius:5px;overflow:hidden;display:flex}
.days .dn{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.days button.zero{color:var(--muted)}
.list{display:flex;flex-direction:column}
.rec{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;align-items:center}
.rec:first-child{border-top:0}
.rec .thumb{grid-row:1/3;width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--sunk);border:1px solid var(--line)}
.rec .nothumb{grid-row:1/3;width:0}
.rec .t{font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
.rec .m{color:var(--muted);font-size:13px;grid-column:2/3;overflow-wrap:anywhere}
.rec .del{padding:4px 10px;min-height:38px;font-size:14px;grid-row:1/3;grid-column:3}
.rec .del.confirm{background:var(--red);color:#fff;border-color:var(--red)}
.empty{color:var(--muted);font-size:15px;padding:8px 0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.fields{display:grid;gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.toggle button{min-width:96px}
.toggle button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}

/* entry sheet: full screen on phones */
.sheet{position:fixed;inset:0;z-index:30;background:var(--surface);display:flex;flex-direction:column}
@media (min-width:700px){.sheet{inset:auto 0 0 0;max-height:92dvh;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25)}}
.sheet header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:19px;flex:1}
.sheet header .zl{display:block;font-size:13px;color:var(--muted);font-weight:500}
.sheet header button{min-width:44px;padding:0;font-size:22px;border:0;background:var(--sunk)}
.sheet .body{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
.sheet .inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet footer{display:flex;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet footer button{flex:1;min-height:52px;font-size:17px}
.sheet footer .primary{flex:2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;font-size:15px;border-radius:22px;padding:8px 14px}
.chips button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.chips button[aria-pressed="true"] .dot{box-shadow:0 0 0 2px #fff}
.defbox{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--brand-soft)}
.req{color:var(--red)}
.obox{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.obox.ask{border:2px solid #E0A100;background:#FFF8E6}
:root[data-theme="dark"] .obox.ask{background:#2B2410}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .obox.ask{background:#2B2410}}
.olist{display:flex;flex-direction:column;gap:8px}
.olist .orow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:15px}
.olist .orow .n{font-family:var(--mono);font-size:13px}
.olist .orow .m{grid-column:1/-1;color:var(--muted);font-size:13px}
.stepper{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:6px}
.stepper button{padding:0;font-size:24px;font-weight:700}
.stepper input{text-align:center;font-family:var(--mono);font-size:20px}
.photo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.zhint{font-size:13px;color:var(--muted)}
.cbox{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.crow{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 0;border-top:1px solid var(--line);cursor:pointer}
.crow:first-of-type{border-top:0}
.crow input{width:22px;height:22px;flex:none;accent-color:var(--red);margin:0}
.crow .cn{flex:1;min-width:0;font-size:14px;line-height:1.25}
.crow .cn small{display:block;color:var(--muted);font-size:12px}
.crow .cq{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;white-space:nowrap}
.kb{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:4px;background:var(--sunk);color:var(--muted);vertical-align:1px}
.kb.x{background:#FDE7E8;color:#B00D12}
.csum{font-size:13px;font-weight:700}
.rcomp{font-size:12px;color:var(--muted);margin-top:2px}
.err{color:var(--red);font-size:15px;font-weight:700}
.toast button{margin-left:12px;min-height:34px;padding:4px 12px;background:transparent;color:inherit;border:1px solid currentColor;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;font-size:15px;z-index:40;max-width:calc(100% - 32px);text-align:center}
.banner{background:#FFF4E5;color:#5A3A00;border:1px solid #F0B35A;border-radius:12px;padding:10px 12px;font-size:14px}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

    ["xl/_rels/workbook.xml.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join("")+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],["xl/styles.xml",styles]];
  sheets.forEach((s,i)=>files.push(["xl/worksheets/sheet"+(i+1)+".xml",sheetXml(s.data,s.widths)]));return zip(files)}
function fileTag(){if(S.period==="day")return S.day.replace(/-/g,"");const d=new Date();const now=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());return S.period==="all"?"todo_"+now:S.period+"d_"+now}

function mapPng(rows){return new Promise((res,rej)=>{const img=$("layout");const W=img.naturalWidth||905,H=img.naturalHeight||899;const head=124;const cv=document.createElement("canvas");cv.width=W;cv.height=H+head;const c=cv.getContext("2d");
  c.fillStyle="#fff";c.fillRect(0,0,cv.width,cv.height);c.fillStyle="#0A2FD0";c.fillRect(0,0,W,4);const lg=$("logo");if(lg.naturalWidth){const lh=24,lw=lg.naturalWidth*lh/lg.naturalHeight;c.drawImage(lg,W-lw-16,14,lw,lh)}
  c.fillStyle="#141A26";c.font="bold 24px Arial";c.fillText(t("pngTitle")+" · "+scopeWhen(),16,38);c.font="15px Arial";c.fillStyle="#5B6474";
  c.fillText((S.view==="alert"?t("vAlert"):t("vHeat"))+" · "+rows.length+" "+t("regs")+" · "+sumQty(rows)+" "+t("pcs")+" · "+t("cls")+": "+clsText()+(filterText()?" · "+filterText():""),16,62);
  const A=computeAlerts();if(S.view==="alert"){let x=16;(S.period==="all"?[["na","lgNa"]]:[["hi","lgHi"],["mid","lgMid"],["ok","lgOk"]]).forEach(([k,s])=>{c.beginPath();c.arc(x+6,84,6,0,6.283);c.fillStyle=ST[k];c.fill();c.fillStyle="#5B6474";c.fillText(t(s),x+16,89);x+=c.measureText(t(s)).width+40});
    const hi=A.groups.filter(o=>o.st==="hi").sort((p,q)=>q.sP-p.sP).slice(0,4).map(o=>o.key+" "+ratioTxt(o)).join(",  ");if(hi){c.font="bold 15px Arial";c.fillStyle="#D7141A";c.fillText(hi,16,112)}}
  c.drawImage(img,0,head,W,H);if(S.view==="heat"){const pr=placeRows(rows);c.drawImage(heatLayer(pr,W,H),0,head);if(S.pins)drawPinsOn(c,pr,W,H,head,false)}else drawBubbles(c,A,W,H,head,1.2);
  try{cv.toBlob(b=>b?res(b):rej(new Error("blob")),"image/png")}catch(e){rej(e)}})}
$("btnPng").addEventListener("click",async()=>{try{const b=await mapPng(filtered());await Store.saveFile("mapa_"+(S.view==="alert"?"alerta_":"calor_")+fileTag()+".png",b)}catch(e){toast(t("fileErr"))}});

/* ---------- Import (Excel from this app; older CSV accepted) ---------- */
async function unzipEntries(buf){const u8=new Uint8Array(buf),dv=new DataView(buf);let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error("zip");
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};const dec=new TextDecoder();
  for(let i=0;i<n;i++){const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);const name=dec.decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    const st=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);out[name]={method,data:u8.subarray(st,st+csize)}}
  return {async text(name){const f=out[name];if(!f)return null;if(f.method===0)return dec.decode(f.data);const s=new Blob([f.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return await new Response(s).text()}}}
async function readXlsxRows(buf){const z=await unzipEntries(buf);const parse=s=>new DOMParser().parseFromString(s,"application/xml");const ssx=await z.text("xl/sharedStrings.xml");
  const ss=ssx?[...parse(ssx).getElementsByTagName("si")].map(si=>[...si.getElementsByTagName("t")].map(x=>x.textContent).join("")):[];const sx=parse(await z.text("xl/worksheets/sheet1.xml"));const rows=[];
  [...sx.getElementsByTagName("row")].forEach(row=>{const arr=[];[...row.getElementsByTagName("c")].forEach(c=>{const col=(c.getAttribute("r")||"").replace(/\d+/g,"");let ci=0;for(const ch of col)ci=ci*26+ch.charCodeAt(0)-64;ci--;
    const tp=c.getAttribute("t");let v="";if(tp==="inlineStr")v=[...c.getElementsByTagName("t")].map(x=>x.textContent).join("");else{const vv=c.getElementsByTagName("v")[0];v=vv?vv.textContent:"";if(tp==="s")v=ss[+v]||"";else if(tp!=="str"&&v!==""&&!isNaN(+v))v=+v}
    arr[ci<0?arr.length:ci]=v});rows.push(arr)});return rows}
function typeId(n){n=String(n||"").trim();if(DEF[n]||LEGACY[n])return n;const lo=n.toLowerCase();const o=Object.values(DEF).find(x=>x.es.toLowerCase()===lo||x.ko===n);if(o)return o.id;if(CAT.aliases[lo])return CAT.aliases[lo];const l=Object.keys(LEGACY).find(k=>LEGACY[k].es===n||LEGACY[k].ko===n);return l||"otro"}
function shiftId(n){n=String(n||"").trim();const up=n.toUpperCase().replace("Í","I");const o=SHIFTS.find(x=>x.id===up||x.es===n||x.ko===n);if(o)return o.id;const l=Object.keys(LEGACY_SHIFT).find(k=>k===n||LEGACY_SHIFT[k].es===n||LEGACY_SHIFT[k].ko===n);return l||n}
function procId(n){n=String(n||"").trim();if(PROC[n])return n;const o=CAT.procs.find(p=>p.es===n||p.ko===n);if(o)return o.id;const l=Object.keys(LEGACY_PROC).find(k=>LEGACY_PROC[k].es===n||LEGACY_PROC[k].ko===n);return l||n}
function xlDate(v){if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return [d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()]}const m=String(v).match(/(\d{4})-(\d\d)-(\d\d)/);return m?[+m[1],+m[2],+m[3]]:null}
function xlTime(v){if(typeof v==="number"){const m=Math.round((v%1)*1440);return [Math.floor(m/60),m%60]}const m=String(v||"").match(/(\d{1,2}):(\d\d)/);return m?[+m[1],+m[2]]:[12,0]}
function importRowsFromTable(rows){const head=(rows.shift()||[]).map(h=>String(h==null?"":h).trim());const ix=pre=>head.findIndex(h=>h.toLowerCase().startsWith(pre.toLowerCase()));
  const c={f:ix("Fecha"),h:ix("Hora"),tu:ix("Turno"),pr:ix("Proceso"),ma:ix("Máquina"),opr:ix("Proceso origen"),oma:ix("Máquina origen"),pa:ix("No. de parte"),lo:ix("Lote"),de:ix("Defecto"),pz:ix("Piezas"),op:ix("Operador"),in:ix("Inspector")>=0?ix("Inspector"):ix("Auditor"),mo:ix("Motivo")>=0?ix("Motivo"):ix("Nota"),fu:ix("Fuente"),x:ix("X mapa"),y:ix("Y mapa")};
  if(c.f<0||c.x<0||c.y<0)throw new Error("head");const g=(r,k)=>c[k]>=0&&r[c[k]]!=null?r[c[k]]:"";const out=[];
  rows.forEach(r=>{const d=xlDate(g(r,"f"));if(!d)return;const src=String(g(r,"fu")).trim();if(src===T.es.srcH||src===T.ko.srcH)return;const [hh,mm]=xlTime(g(r,"h"));const ts=new Date(d[0],d[1]-1,d[2],hh,mm).getTime();
    const x=+(+g(r,"x")/100).toFixed(4),y=+(+g(r,"y")/100).toFixed(4);if(!isFinite(ts)||!(x>=0&&x<=1&&y>=0&&y<=1))return;const q=Math.round(+g(r,"pz"));
    out.push({x,y,ts,type:typeId(g(r,"de")),shift:shiftId(g(r,"tu")),proc:procId(g(r,"pr")),mach:String(g(r,"ma")),oproc:(()=>{const a=procId(g(r,"opr")),b=procId(g(r,"pr"));return a&&a!==b?a:""})(),omach:(()=>{const a=procId(g(r,"opr")),b=procId(g(r,"pr"));return a&&a!==b?String(g(r,"oma")):""})(),part:String(g(r,"pa")),qty:q>0?q:1,lot:String(g(r,"lo")),worker:String(g(r,"in")),oper:String(g(r,"op")),note:String(g(r,"mo"))})});return out}
function parseCSV(text){const rows=[];let row=[],f="",q=false;text=text.replace(/^﻿/,"");for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===","){row.push(f);f=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=ch}if(f!==""||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.length>1||r[0])}
function importOldCSV(text){const rows=parseCSV(text);const head=(rows.shift()||[]).map(h=>h.trim());const ix=k=>head.indexOf(k);const kDate=ix("fecha_iso")>=0?"fecha_iso":"fecha";if(ix(kDate)<0||ix("x_pct")<0)throw new Error("head");
  const g=(c,k)=>ix(k)>=0?(c[ix(k)]||""):"";const out=[];rows.forEach(c=>{const ts=Date.parse(g(c,kDate));const x=+(+g(c,"x_pct")/100).toFixed(4),y=+(+g(c,"y_pct")/100).toFixed(4);if(!isFinite(ts)||!(x>=0&&x<=1&&y>=0&&y<=1))return;const q=Math.round(+g(c,"piezas"));
    out.push({x,y,ts,type:typeId(g(c,"tipo")),shift:shiftId(g(c,"turno")),proc:procId(g(c,"proceso")),mach:g(c,"maquina"),part:g(c,"no_parte"),qty:q>0?q:1,lot:g(c,"lote"),worker:g(c,"operador"),oper:"",note:g(c,"nota")})});return out}
$("inImport").addEventListener("change",async e=>{const file=e.target.files&&e.target.files[0];e.target.value="";if(!file)return;
  try{const recs=/\.csv$/i.test(file.name)?importOldCSV(await file.text()):importRowsFromTable(await readXlsxRows(await file.arrayBuffer()));const n=await Store.addMany(recs);toast(t("impOk")+n)}catch(err){toast(t("impErr"))}});

function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)))}

(function(){const m=location.hash.match(/cfg=([\w-]+)/);if(!m)return;try{const o=JSON.parse(unb64u(m[1]));if(o&&o.u&&/^https?:\/\//.test(o.u)){const c=Store.cfg();lsSet(CFG,{url:o.u,key:o.k||"",name:c.name||""});lsSet(LAST,0);setTimeout(()=>toast(t("gsCfgIn")),500)}}catch(e){}
  history.replaceState(null,"",location.pathname+location.search)})();
